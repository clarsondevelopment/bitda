name: bitda
description: "Blessed in Tech Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_launcher_icons: ^0.13.1
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.0
  table_calendar: ^3.1.2
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  latlong2: ^0.10.1
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/bitLogo.png"
  min_sdk_android: 21
